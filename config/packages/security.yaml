security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Exactly ONE provider, on purpose. SecurityExtension throws "Not configuring
    # explicitly the provider ... is ambiguous" as soon as a second one exists, and
    # that would hit the `api` firewall too - even though ApiKeyAuthenticator uses a
    # SelfValidatingPassport with an inline user loader and never asks a provider for
    # anything. Adding a second provider means giving every firewall below an explicit
    # `provider:` key, `api` included.
    providers:
        app_users:
            entity:
                class: App\Security\User
                property: email

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        api:
            # Machine-to-machine auth for the ingestion API (spec 04.2, 08.2): stateless,
            # no login form, no CSRF. Project identity comes only from the API key.
            pattern: ^/api/v1/
            stateless: true
            custom_authenticators:
                - App\Security\ApiKeyAuthenticator
        main:
            lazy: true
            provider: app_users
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true # off by default in FormLoginFactory
            logout:
                path: /logout # must start with "/" to produce the _logout_main route
                enable_csrf: true

    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        # Guarded by the `api` firewall's API key, not by user roles.
        - { path: ^/api/v1/, roles: PUBLIC_ACCESS }
        - { path: ^/, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
