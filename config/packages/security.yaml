security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Exactly ONE provider, on purpose: SecurityExtension throws "Not configuring the
    # provider ... is ambiguous" as soon as a second one exists. Adding one means giving
    # every firewall below an explicit `provider:` key.
    providers:
        app_users:
            entity:
                class: App\Security\User
                property: email

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_users
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true # off by default in FormLoginFactory
            logout:
                path: /logout # must start with "/" to produce the _logout_main route
                enable_csrf: true

    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        # In dev, skip login entirely (no seeded users needed to poke at a project locally).
        # allow_if wins over roles when both are present, so this is the only override needed.
        - { path: ^/, roles: IS_AUTHENTICATED_FULLY, allow_if: "request.server.get('APP_ENV') == 'dev' or is_fully_authenticated()" }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
