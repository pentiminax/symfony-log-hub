version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: cargo
    directory: /engine
    schedule: { interval: weekly }
    groups:
      cargo: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /engine/ui
    schedule: { interval: weekly }
    groups:
      npm: { update-types: [minor, patch] }
  - package-ecosystem: composer
    directory: /packages/symfony-bundle
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /engine
    schedule: { interval: weekly }
