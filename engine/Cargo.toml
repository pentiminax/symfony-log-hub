[package]
name = "loghub-engine"
version = "0.1.0"
edition = "2024"
description = "LogHub storage, ingestion and search engine"
publish = false

[dependencies]
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1"
hex = "0.4"
opentelemetry-proto = { version = "0.31", default-features = false, features = ["gen-tonic-messages", "trace"] }
prost = "0.14"
rust-embed = { version = "8", features = ["mime-guess"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "migrate", "macros", "derive"] }
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
